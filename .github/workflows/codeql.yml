name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Keep code-scanning results available for merge-queue branches, too.
  merge_group:
  schedule:
    - cron: '30 5 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
        # Supported: javascript, python, go, java, csharp, cpp, ruby, swift

    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        # Merge-queue refs disappear as soon as GitHub merges the group.
        # Upload results from the durable PR and main push workflows instead.
        with:
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}
